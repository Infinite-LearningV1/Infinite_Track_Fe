<div class="relative shrink-0">
  <button
    id="bookingTableFilterTrigger"
    type="button"
    @click="openFilter()"
    :aria-expanded="isFilterOpen"
    aria-controls="bookingTableFilterPopover"
    class="text-theme-sm shadow-theme-xs inline-flex h-10 w-full items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 font-medium text-gray-700 transition hover:bg-gray-100 hover:text-gray-800 focus:ring-2 focus:ring-gray-400 focus:outline-none sm:w-auto dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-200"
  >
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path
        d="M2.29 4.5h15.42a.75.75 0 01.53 1.28l-5.65 5.65a1 1 0 00-.29.7v4.02a.75.75 0 01-1.1.66l-2.5-1.3a.75.75 0 01-.4-.66v-2.72a1 1 0 00-.29-.7L2.06 5.78a.75.75 0 01.23-1.28z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
    Filter
    <span
      x-show="activeFilterCount > 0"
      x-text="activeFilterCount"
      class="bg-brand-500 inline-flex min-w-5 items-center justify-center rounded-full px-1.5 py-0.5 text-xs font-semibold text-white"
      aria-label="Filter aktif"
    ></span>
  </button>

  <div
    id="bookingTableFilterPopover"
    tabindex="-1"
    x-cloak
    x-show="isFilterOpen"
    x-transition.opacity.duration.150ms
    @click.outside="closeFilter()"
    @keydown.escape.window="closeFilter()"
    class="absolute top-full right-0 z-50 mt-2 w-[calc(100vw-2rem)] max-w-md overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl max-sm:fixed max-sm:inset-x-4 max-sm:top-20 max-sm:z-99999 sm:w-[24rem] dark:border-gray-700 dark:bg-gray-900"
    role="dialog"
    aria-modal="false"
    aria-labelledby="bookingFilterTitle"
  >
    <div
      class="flex items-start justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-700"
    >
      <div>
        <h2
          id="bookingFilterTitle"
          class="text-sm font-semibold text-gray-900 dark:text-white"
        >
          Filter booking
        </h2>
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
          Filter status dan jadwal WFA.
        </p>
      </div>
      <button
        type="button"
        @click="closeFilter()"
        aria-label="Tutup filter booking"
        class="rounded-lg p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-700 focus:outline-none dark:hover:bg-white/5 dark:hover:text-gray-200"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="max-h-[65vh] space-y-4 overflow-y-auto p-4">
      <div>
        <label
          for="bookingFilterStatus"
          class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >Status</label
        >
        <select
          id="bookingFilterStatus"
          x-model="draftFilters.status"
          :disabled="tableState.loading"
          class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:ring-4 focus:outline-none disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-800 dark:text-white/90"
        >
          <option value="">Semua status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <fieldset>
        <legend
          class="mb-2 text-sm font-medium text-gray-700 dark:text-gray-300"
        >
          Jadwal WFA
        </legend>
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label
              for="bookingFilterDateFrom"
              class="mb-1 block text-xs text-gray-500 dark:text-gray-400"
              >Mulai</label
            >
            <input
              id="bookingFilterDateFrom"
              type="date"
              x-model="draftFilters.dateFrom"
              :disabled="tableState.loading"
              class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:ring-4 focus:outline-none disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-800 dark:text-white/90"
            />
          </div>
          <div>
            <label
              for="bookingFilterDateTo"
              class="mb-1 block text-xs text-gray-500 dark:text-gray-400"
              >Selesai</label
            >
            <input
              id="bookingFilterDateTo"
              type="date"
              x-model="draftFilters.dateTo"
              :disabled="tableState.loading"
              class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:ring-4 focus:outline-none disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-800 dark:text-white/90"
            />
          </div>
        </div>
      </fieldset>

      <p
        x-show="filterValidationMessage"
        x-text="filterValidationMessage"
        role="alert"
        class="bg-error-50 text-error-700 dark:bg-error-500/15 dark:text-error-300 rounded-lg px-3 py-2 text-sm"
      ></p>
    </div>

    <div
      class="flex flex-col-reverse gap-2 border-t border-gray-200 bg-gray-50 px-4 py-3 sm:flex-row sm:justify-end dark:border-gray-700 dark:bg-gray-800/50"
    >
      <button
        type="button"
        @click="clearFilters()"
        :disabled="tableState.loading"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
      >
        Bersihkan
      </button>
      <button
        type="button"
        @click="applyFilters()"
        :disabled="tableState.loading"
        class="bg-brand-500 hover:bg-brand-600 rounded-lg px-4 py-2 text-sm font-medium text-white disabled:cursor-wait disabled:opacity-60"
      >
        Terapkan filter
      </button>
    </div>
  </div>
</div>
