<div class="mt-6 grid grid-cols-1 gap-6 xl:grid-cols-2">
  <section
    x-data="wfaReasonCatalogAlpineData('request')"
    x-init="init()"
    class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]"
  >
    <div
      class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"
    >
      <div>
        <h2
          class="text-lg font-semibold text-gray-900 dark:text-white"
          x-text="copy.title"
        ></h2>
        <p
          class="mt-1 text-sm text-gray-500 dark:text-gray-400"
          x-text="copy.description"
        ></p>
      </div>
      <button
        type="button"
        @click="openCreate()"
        :disabled="isLoading || isSaving"
        class="bg-brand-500 hover:bg-brand-600 rounded-lg px-4 py-2 text-sm font-medium text-white disabled:cursor-not-allowed disabled:opacity-50"
      >
        Tambah alasan
      </button>
    </div>

    <template x-if="loadError">
      <div
        class="mt-4 rounded-lg border border-red-200 bg-red-50 p-4 dark:border-red-800 dark:bg-red-900/20"
      >
        <p
          class="text-sm text-red-700 dark:text-red-300"
          x-text="loadError"
        ></p>
        <button
          type="button"
          @click="loadCatalog()"
          :disabled="isLoading"
          class="mt-2 text-sm font-medium text-red-700 underline dark:text-red-300"
        >
          Coba lagi
        </button>
      </div>
    </template>

    <p x-show="isLoading" class="mt-4 text-sm text-gray-500 dark:text-gray-400">
      Memuat katalog...
    </p>

    <div x-show="!isLoading && !loadError" class="mt-4 space-y-3">
      <p
        x-show="items.length === 0"
        class="rounded-lg border border-dashed border-gray-300 p-4 text-sm text-gray-500 dark:border-gray-700 dark:text-gray-400"
      >
        Belum ada alasan pengajuan WFA.
      </p>
      <template x-for="reason in items" :key="reason.id">
        <article
          class="flex flex-col gap-3 rounded-lg border border-gray-200 p-4 sm:flex-row sm:items-center sm:justify-between dark:border-gray-700"
        >
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <span
                class="font-medium text-gray-900 dark:text-white"
                x-text="reason.label"
              ></span>
              <span
                x-show="reason.isOther"
                class="rounded-full bg-blue-50 px-2 py-0.5 text-xs text-blue-700 dark:bg-blue-900/20 dark:text-blue-300"
              >
                Lainnya
              </span>
              <span
                class="rounded-full px-2 py-0.5 text-xs"
                :class="reason.isActive ? 'bg-green-50 text-green-700 dark:bg-green-900/20 dark:text-green-300' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300'"
                x-text="reason.isActive ? 'Aktif' : 'Nonaktif'"
              ></span>
            </div>
            <p
              class="mt-1 text-xs text-gray-500 dark:text-gray-400"
              x-text="`Urutan ${reason.sortOrder}`"
            ></p>
          </div>
          <div class="flex gap-2">
            <button
              type="button"
              @click="openEdit(reason)"
              :disabled="isSaving || isMutating(reason.id)"
              class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm disabled:opacity-50 dark:border-gray-600 dark:text-gray-300"
            >
              Edit
            </button>
            <button
              type="button"
              @click="setReasonActive(reason, !reason.isActive)"
              :disabled="isSaving || isMutating(reason.id)"
              x-text="reason.isActive ? 'Nonaktifkan' : 'Aktifkan'"
              class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm disabled:opacity-50 dark:border-gray-600 dark:text-gray-300"
            ></button>
          </div>
        </article>
      </template>
    </div>

    <div
      x-show="editorMode"
      class="mt-5 space-y-4 rounded-xl border border-gray-200 p-4 dark:border-gray-700"
    >
      <div>
        <label class="block text-sm font-medium dark:text-gray-300">
          Label alasan
        </label>
        <input
          type="text"
          x-model="form.label"
          :disabled="isSaving"
          class="mt-1 h-10 w-full rounded-lg border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white"
        />
        <p
          x-show="fieldErrors.label"
          x-text="fieldErrors.label"
          class="mt-1 text-xs text-red-500"
        ></p>
      </div>
      <div>
        <label class="block text-sm font-medium dark:text-gray-300">
          Urutan
        </label>
        <input
          type="number"
          min="0"
          step="1"
          x-model="form.sortOrder"
          :disabled="isSaving"
          class="mt-1 h-10 w-full rounded-lg border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white"
        />
        <p
          x-show="fieldErrors.sortOrder"
          x-text="fieldErrors.sortOrder"
          class="mt-1 text-xs text-red-500"
        ></p>
      </div>
      <label class="flex items-center gap-2 text-sm dark:text-gray-300">
        <input
          type="checkbox"
          x-model="form.isOther"
          :disabled="isSaving"
          class="rounded border-gray-300"
        />
        Tandai sebagai opsi Lainnya
      </label>
      <p
        x-show="saveError"
        x-text="saveError"
        class="text-sm text-red-600 dark:text-red-400"
      ></p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          @click="cancelEditor()"
          :disabled="isSaving"
          class="rounded-lg border border-gray-300 px-4 py-2 text-sm dark:border-gray-600 dark:text-gray-300"
        >
          Batal
        </button>
        <button
          type="button"
          @click="saveEditor()"
          :disabled="isSaving"
          class="bg-brand-500 hover:bg-brand-600 rounded-lg px-4 py-2 text-sm text-white disabled:opacity-50"
        >
          <span x-text="isSaving ? 'Menyimpan...' : 'Simpan'"></span>
        </button>
      </div>
    </div>
  </section>

  <section
    x-data="wfaReasonCatalogAlpineData('rejection')"
    x-init="init()"
    class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]"

    </div>

      <div

        <p

        <button

      >
        Belum ada alasan penolakan WFA.
      </p>
      <template x-for="reason in items" :key="reason.id">
        <article

                x-text="reason.isActive ? 'Aktif' : 'Nonaktif'"

            >

              class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm disabled:opacity-50 dark:border-gray-600 dark:text-gray-300"
            ></button>
          </div>
        </article>
      </template>
    </div>

    <div

      class="mt-5 space-y-4 rounded-xl border border-gray-200 p-4 dark:border-gray-700"
    >
      <div>
        <label class="block text-sm font-medium dark:text-gray-300">
          Label alasan
        </label>
        <input
          type="text"
          x-model="form.label"
          :disabled="isSaving"
          class="mt-1 h-10 w-full rounded-lg border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white"
        />
        <p
          x-show="fieldErrors.label"
          x-text="fieldErrors.label"
          class="mt-1 text-xs text-red-500"
        ></p>
      </div>
      <div>
        <label class="block text-sm font-medium dark:text-gray-300">
          Urutan
        </label>
        <input
          type="number"
          min="0"
          step="1"
          x-model="form.sortOrder"
          :disabled="isSaving"
          class="mt-1 h-10 w-full rounded-lg border border-gray-300 px-3 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white"
        />
        <p
          x-show="fieldErrors.sortOrder"
          x-text="fieldErrors.sortOrder"
          class="mt-1 text-xs text-red-500"
        ></p>
      </div>
      <label class="flex items-center gap-2 text-sm dark:text-gray-300">
        <input
          type="checkbox"
          x-model="form.isOther"
          :disabled="isSaving"
          class="rounded border-gray-300"
        />
        Tandai sebagai opsi Lainnya
      </label>
      <p
        x-show="saveError"
        x-text="saveError"
        class="text-sm text-red-600 dark:text-red-400"
      ></p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          @click="cancelEditor()"
          :disabled="isSaving"
          class="rounded-lg border border-gray-300 px-4 py-2 text-sm dark:border-gray-600 dark:text-gray-300"
        >
          Batal
        </button>
        <button
          type="button"
          @click="saveEditor()"
          :disabled="isSaving"
          class="bg-brand-500 hover:bg-brand-600 rounded-lg px-4 py-2 text-sm text-white disabled:opacity-50"

          <span x-text="isSaving ? 'Menyimpan...' : 'Simpan'"></span>
        </button>
      </div>
    </div>
  </section>
</div>
