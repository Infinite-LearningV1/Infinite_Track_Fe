<!-- Filter button + anchored popover (Task 3). Alpine scope is inherited from
     userListAlpineData() in the including template. -->
<div class="relative">
  <button
    type="button"
    @click="isFilterOpen = !isFilterOpen"
    :aria-expanded="isFilterOpen"
    aria-controls="userTableFilterPopover"
    class="text-theme-sm shadow-theme-xs inline-flex h-10 items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-200"
  >
    <svg
      class="h-4 w-4"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M2.29 4.5h15.42a.75.75 0 01.53 1.28l-5.65 5.65a1 1 0 00-.29.7v4.02a.75.75 0 01-1.1.66l-2.5-1.3a.75.75 0 01-.4-.66v-2.72a1 1 0 00-.29-.7L2.06 5.78a.75.75 0 01.23-1.28z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
    Filter
  </button>

  <!-- Filter popover panel -->
  <div
    id="userTableFilterPopover"
    x-show="isFilterOpen"
    x-cloak
    @click.outside="isFilterOpen = false"
    @keydown.escape.window="isFilterOpen = false"
    class="absolute top-full right-0 z-50 mt-2 w-64 rounded-xl border border-gray-200 bg-white p-4 shadow-lg dark:border-gray-700 dark:bg-gray-900"
    style="display: none"
  >
    <div class="flex flex-col gap-4">
      <!-- Role -->
      <div>
        <label
          for="userTableFilterRole"
          class="text-theme-xs mb-1.5 block font-medium text-gray-700 dark:text-gray-300"
          >Role</label
        >
        <select
          id="userTableFilterRole"
          x-model="filterRole"
          class="focus:ring-brand-500 focus:border-brand-500 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:ring-1 focus:outline-none dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
        >
          <option value="">Semua</option>
          <template x-for="role in availableRoles" :key="role">
            <option :value="role" x-text="role"></option>
          </template>
        </select>
      </div>

      <!-- Divisi / Program -->
      <div>
        <label
          for="userTableFilterDivision"
          class="text-theme-xs mb-1.5 block font-medium text-gray-700 dark:text-gray-300"
          >Divisi / Program</label
        >
        <select
          id="userTableFilterDivision"
          x-model="filterDivision"
          :disabled="availableDivisions.length === 0"
          class="focus:ring-brand-500 focus:border-brand-500 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:ring-1 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
        >
          <option value="">Semua</option>
          <template x-for="division in availableDivisions" :key="division.id">
            <option :value="division.name" x-text="division.name"></option>
          </template>
        </select>
      </div>

      <!-- Status Lokasi WFH -->
      <div>
        <label
          for="userTableFilterWfhStatus"
          class="text-theme-xs mb-1.5 block font-medium text-gray-700 dark:text-gray-300"
          >Status Lokasi WFH</label
        >
        <select
          id="userTableFilterWfhStatus"
          x-model="filterWfhStatus"
          class="focus:ring-brand-500 focus:border-brand-500 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:ring-1 focus:outline-none dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
        >
          <option value="">Semua</option>
          <option value="Tersedia">Tersedia</option>
          <option value="Belum diatur">Belum diatur</option>
        </select>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 pt-1">
        <button
          type="button"
          @click="resetFilters()"
          class="text-theme-sm rounded-lg border border-gray-300 bg-white px-3 py-2 font-medium text-gray-700 hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/5"
        >
          Reset
        </button>
        <button
          type="button"
          @click="applyFilters()"
          class="text-theme-sm bg-brand-500 hover:bg-brand-600 rounded-lg px-3 py-2 font-medium text-white"
        >
          Apply
        </button>
      </div>
    </div>
  </div>
</div>
