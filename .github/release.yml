changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
    authors:
      - "coderabbitai[bot]"
      - "copilot-pull-request-reviewer[bot]"
      - "dependabot[bot]"
      - "github-actions[bot]"

  categories:
    - title: "✨ Enhancements"
      labels:
        - enhancement

    - title: "🐛 Fixes"
      labels:
        - bug

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "🔧 Other Changes"
      labels:
        - "*"
