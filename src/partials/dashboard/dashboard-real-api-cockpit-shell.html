<section
  class="rounded-3xl border border-blue-100 bg-blue-50/60 p-5 shadow-sm dark:border-blue-500/20 dark:bg-blue-500/10"
>
  <div
    class="mb-6 flex flex-col gap-4 border-b border-blue-100 pb-6 lg:flex-row lg:items-start lg:justify-between dark:border-blue-500/20"
  >
    <div class="max-w-4xl">
      <div class="flex flex-wrap items-center gap-2">
        <span
          class="inline-flex rounded-full bg-white px-3 py-1 text-xs font-semibold text-blue-700 shadow-sm dark:bg-blue-500/15 dark:text-blue-200"
          x-text="realApiCockpit.phaseLabel"
        ></span>
        <span
          class="inline-flex rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700 dark:bg-amber-500/15 dark:text-amber-200"
        >
          Real API not wired
        </span>
      </div>
      <h3 class="mt-3 text-2xl font-semibold text-gray-900 dark:text-white">
        INF-160 Real API Cockpit Shell
      </h3>
      <p
        class="mt-2 text-sm leading-6 text-gray-600 dark:text-gray-300"
        x-text="realApiCockpit.sourceNote"
      ></p>
    </div>

    <div
      class="rounded-2xl border border-blue-100 bg-white px-4 py-3 text-sm text-gray-600 shadow-sm dark:border-blue-500/20 dark:bg-gray-900 dark:text-gray-300"
    >
      <p class="font-semibold text-gray-900 dark:text-white">Provider</p>
      <p
        class="mt-1 tracking-[0.18em] uppercase"
        x-text="realApiCockpit.provider"
      ></p>
    </div>
  </div>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
    <template
      x-for="metric in realApiCockpit.overviewMetrics"
      :key="metric.key"
    >
      <article
        class="rounded-2xl border bg-white p-4 shadow-sm dark:bg-gray-900"
        :class="{
          'border-gray-200 dark:border-gray-800': metric.tone === 'neutral',
          'border-blue-200 dark:border-blue-500/20': metric.tone === 'info',
          'border-green-200 dark:border-green-500/20': metric.tone === 'positive',
          'border-amber-200 dark:border-amber-500/20': metric.tone === 'warning',
          'border-rose-200 dark:border-rose-500/20': metric.tone === 'critical'
        }"
      >
        <p
          class="text-sm font-medium text-gray-500 dark:text-gray-400"
          x-text="metric.label"
        ></p>
        <p
          class="mt-3 text-2xl font-semibold text-gray-900 dark:text-white"
          x-text="metric.value"
        ></p>
      </article>
    </template>
  </div>

  <div class="mt-6 grid gap-5 xl:grid-cols-3">
    <template x-for="section in realApiCockpit.sections" :key="section.key">
      <section
        class="rounded-3xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-white/[0.03]"
      >
        <div class="mb-5">
          <p
            class="text-xs tracking-[0.2em] text-gray-400 uppercase dark:text-gray-500"
          >
            Contract Section
          </p>
          <h4
            class="mt-2 text-lg font-semibold text-gray-900 dark:text-white"
            x-text="section.title"
          ></h4>
          <p
            class="mt-2 text-sm leading-6 text-gray-500 dark:text-gray-400"
            x-text="section.description"
          ></p>
        </div>

        <div class="space-y-3">
          <template x-for="panel in section.panels" :key="panel.key">
            <article
              class="rounded-2xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-900"
            >
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h5
                    class="text-sm font-semibold text-gray-900 dark:text-white"
                    x-text="panel.title"
                  ></h5>
                  <p
                    class="mt-1 text-xs text-gray-500 dark:text-gray-400"
                    x-text="panel.owner"
                  ></p>
                </div>
                <span
                  class="rounded-full px-2.5 py-1 text-xs font-medium"
                  :class="{
                    'bg-blue-50 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300': panel.state === 'loading',
                    'bg-green-50 text-green-700 dark:bg-green-500/15 dark:text-green-300': panel.state === 'ready',
                    'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300': panel.state === 'empty',
                    'bg-violet-50 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300': panel.state === 'backendRequired',
                    'bg-red-50 text-red-700 dark:bg-red-500/15 dark:text-red-300': panel.state === 'error'
                  }"
                  x-text="panel.stateLabel"
                ></span>
              </div>
              <p
                class="mt-4 rounded-xl bg-white px-3 py-2 text-xs font-medium break-all text-gray-600 dark:bg-gray-800 dark:text-gray-300"
                x-text="panel.endpoint"
              ></p>
              <p
                class="mt-3 text-sm leading-6 text-gray-600 dark:text-gray-300"
                x-text="panel.sourceNote"
              ></p>
            </article>
          </template>
        </div>
      </section>
    </template>
  </div>

  <div class="mt-6 grid gap-4 lg:grid-cols-2">
    <div
      class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]"
    >
      <h4 class="text-base font-semibold text-gray-900 dark:text-white">
        Phase 3 transition plan
      </h4>
      <ol
        class="mt-4 list-decimal space-y-2 pl-5 text-sm leading-6 text-gray-600 dark:text-gray-300"
      >
        <template
          x-for="item in realApiCockpit.phase3TransitionPlan"
          :key="item"
        >
          <li x-text="item"></li>
        </template>
      </ol>
    </div>
    <div
      class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]"
    >
      <h4 class="text-base font-semibold text-gray-900 dark:text-white">
        Truthfulness guardrails
      </h4>
      <ul
        class="mt-4 list-disc space-y-2 pl-5 text-sm leading-6 text-gray-600 dark:text-gray-300"
      >
        <template
          x-for="guardrail in realApiCockpit.guardrails"
          :key="guardrail"
        >
          <li x-text="guardrail"></li>
        </template>
      </ul>
    </div>
  </div>
</section>
