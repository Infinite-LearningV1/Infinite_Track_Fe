x-nginx-gateway: &nginx-gateway
  image: nginx:1.27-alpine
  ports:
    - "${GATEWAY_PORT:-8080}:80"
  volumes:
    - ./docker/nginx/dev.conf:/opt/nginx/dev.conf:ro
    - ./docker/nginx/staging.conf:/opt/nginx/staging.conf:ro
    - ./docker/nginx/select-config.sh:/docker-entrypoint.d/99-select-config.sh:ro
    - frontend_dist:/usr/share/nginx/html:ro
  networks:
    - app

services:
  backend:
    image: ${BACKEND_IMAGE:-infinite-track-backend:latest}
    profiles: ["dev", "staging"]
    expose:
      - "3005"
    networks:
      - app

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    working_dir: /app
    command: npm run start
    environment:
      NODE_ENV: development
      APP_ENVIRONMENT: development
      WEBPACK_DEV_HOST: 0.0.0.0
      WEBPACK_OPEN: "false"
      WEBPACK_API_PROXY_TARGET: http://backend:3005
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app

  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: artifacts
      args:
        API_BASE_URL: /api
        APP_ENVIRONMENT: staging
        DEBUG_MODE: "false"
        LOG_LEVEL: info
    profiles: ["staging"]
    working_dir: /artifacts
    volumes:
      - frontend_dist:/shared
    healthcheck:
      test: ["CMD", "test", "-f", "/shared/.ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
    networks:
      - app

  nginx-dev:
    <<: *nginx-gateway
    profiles: ["dev"]
    environment:
      NGINX_MODE: dev
    depends_on:
      - backend
      - frontend-dev

  nginx-staging:
    <<: *nginx-gateway
    profiles: ["staging"]
    environment:
      NGINX_MODE: staging
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_dist:

networks:
  app:
    driver: bridge
