<div
  class="rounded-3xl border-0 bg-white px-4 py-3 shadow-sm dark:bg-white/[0.03] sm:px-5"
  x-data="{
    activeFahpTab: panel.data.activeType || panel.data.activeDecisionKey || panel.data.decisions[0]?.key || '',
    get viewState() {
      return getFuzzyAhpViewState(panel, this.activeFahpTab);
    }
  }"
>
  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
    <div class="min-w-0 space-y-1">
      <h4 class="text-xl font-semibold leading-tight tracking-[-0.025em] text-gray-900 dark:text-white">
        Fuzzy AHP Decision Center
      </h4>
    </div>

    <nav class="flex max-w-full overflow-x-auto rounded-lg bg-gray-100 p-1 dark:bg-gray-900 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-gray-200 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-track]:bg-white dark:[&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar]:h-1.5">
      <template x-for="option in panel.data.typeOptions || []" :key="option.key">
        <button
          type="button"
          class="inline-flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors duration-200 ease-in-out"
          :class="activeFahpTab === option.key ? 'bg-white text-gray-900 shadow-theme-xs dark:bg-white/[0.03] dark:text-white' : 'bg-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200'"
          @click="activeFahpTab = option.key; loadFuzzyAhpDetail({ type: option.key })"
          x-text="option.title"
        ></button>
      </template>
    </nav>
  </div>

  <template x-if="viewState.activeDecision">
    <div class="mt-3 max-w-full overflow-x-auto">
      <div class="fuzzy-ahp-card-grid">
        <section class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900">
          <p class="text-xs font-semibold text-gray-800 dark:text-white/90">
            Consistency Check
          </p>

          <div class="mt-3 space-y-3">
            <div>
              <p class="text-[11px] font-medium text-gray-500 dark:text-gray-400">CR Value</p>
              <p
                class="mt-1 text-2xl leading-none font-bold text-success-600 dark:text-success-500"
                x-text="viewState.consistencyRatioLabel"
              ></p>
            </div>

            <div>
              <p class="text-[11px] font-medium text-gray-500 dark:text-gray-400">Threshold</p>
              <p
                class="mt-1 text-2xl leading-none font-bold text-success-600 dark:text-success-500"
                x-text="viewState.thresholdLabel"
              ></p>
            </div>

            <div>
              <p class="text-[11px] font-medium text-gray-500 dark:text-gray-400">Konsistensi</p>
              <div class="mt-1 flex items-center gap-2">
                <p
                  class="text-xl leading-none font-bold"
                  :class="viewState.isConsistent ? 'text-success-600 dark:text-success-500' : 'text-amber-500 dark:text-amber-400'"
                  x-text="viewState.consistencyStatusLabel"
                ></p>
                <span
                  class="inline-flex h-5 w-5 items-center justify-center rounded-full text-white"
                  :class="viewState.isConsistent ? 'bg-success-500' : 'bg-amber-500'"
                >
                  <svg class="h-3 w-3" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M4 8.25L6.7 11L12 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900">
          <p class="text-xs font-semibold text-gray-800 dark:text-white/90">
            Criteria Weights
          </p>

          <div class="mt-3 space-y-2.5">
            <template x-for="criterion in viewState.criteriaRows" :key="criterion.key">
              <div class="grid grid-cols-[minmax(96px,1fr)_minmax(95px,1.05fr)_48px] items-center gap-2.5">
                <p
                  class="truncate text-[11px] font-medium text-gray-600 dark:text-gray-300"
                  x-text="criterion.label"
                ></p>
                <div class="h-2 overflow-hidden rounded-full bg-gray-100 dark:bg-[#233047]">
                  <div
                    class="h-full rounded-full bg-brand-500 shadow-[0_0_10px_rgba(70,95,255,0.30)]"
                    :style="criterion.barStyle"
                  ></div>
                </div>
                <p
                  class="text-right text-[11px] font-semibold text-gray-700 dark:text-gray-200"
                  x-text="criterion.weightLabel"
                ></p>
              </div>
            </template>
          </div>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900">
          <p class="text-xs font-semibold text-gray-800 dark:text-white/90">
            Ranking Preview (Top 5)
          </p>

          <ul class="flex flex-col mt-3 rounded-lg border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
            <template x-for="ranking in viewState.rankingRows" :key="ranking.key">
              <li class="flex items-center gap-2 border-b border-gray-200 px-3 py-2 text-sm text-gray-500 last:border-b-0 dark:border-gray-800 dark:text-gray-400">
                <span
                  class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gray-100 text-xs font-semibold text-gray-600 dark:bg-gray-800 dark:text-gray-300"
                  x-text="ranking.rank"
                ></span>
                <span
                  class="min-w-0 flex-1 truncate text-xs font-medium text-gray-700 dark:text-gray-300"
                  x-text="ranking.label"
                ></span>
                <span
                  class="shrink-0 text-right text-xs font-semibold text-gray-700 dark:text-gray-200"
                  x-text="ranking.scoreLabel"
                ></span>
              </li>
            </template>
          </ul>
        </section>
      </div>
    </div>
  </template>

  <div class="mt-3 flex items-center justify-center gap-2 text-xs font-medium text-gray-500 dark:text-gray-400">
    <span x-text="viewState.updatedAtLabel"></span>
    <span class="inline-flex h-4 w-4 items-center justify-center rounded-full border border-gray-300 text-[10px] dark:border-gray-600">i</span>
  </div>
</div>
