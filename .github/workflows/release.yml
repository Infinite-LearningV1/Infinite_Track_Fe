name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      API_BASE_URL: https://api.infinite-track.tech/api
      APP_ENVIRONMENT: production
      DEBUG_MODE: "false"
      LOG_LEVEL: error

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Validate release identity
        id: release_identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/validate-release.mjs

      - name: Verify stable release source is on master
        run: |
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Validate generated artifact
        run: node scripts/release/validate-build-artifact.mjs

      - name: Package release artifact
        env:
          ARTIFACT_NAME: ${{ steps.release_identity.outputs.artifact_name }}
        run: |
          (cd build && zip -r "../$ARTIFACT_NAME" .)
          test -s "$ARTIFACT_NAME"
          unzip -Z1 "$ARTIFACT_NAME" | grep -Fxq "index.html"

      - name: Attest release artifact
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release_identity.outputs.artifact_name }}

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.release_identity.outputs.release_title }}
          ARTIFACT_NAME: ${{ steps.release_identity.outputs.artifact_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$ARTIFACT_NAME" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TITLE" \
            --generate-notes
