<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Management Attendance | InfiniteTrack - Tailwind CSS Admin Dashboard
      Template
    </title>
  </head>
  <body
    x-data="attendanceManagementPageData(mapDetailModalState())"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/common/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/common/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/common/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Management Attendance`}">
              <include src="./partials/common/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Inline Alert Templates & Container -->
            <include src="./partials/alert/alert-templates.html" />
            <div id="alert-container"></div>

            <div class="space-y-5 sm:space-y-6">
              <!-- Search and Filter Controls -->
              <div
                class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5 dark:border-gray-700 dark:bg-gray-900"
              >
                <div
                  class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"
                >
                  <div class="flex min-w-0 flex-1 flex-col gap-3 sm:flex-row">
                    <!-- Search Input -->
                    <div class="relative min-w-0 flex-1 lg:max-w-xl">
                      <div
                        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
                      >
                        <svg
                          class="h-5 w-5 text-gray-400"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                          aria-hidden="true"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                          ></path>
                        </svg>
                      </div>
                      <label class="sr-only" for="attendanceSearch"
                        >Cari data kehadiran</label
                      >
                      <input
                        id="attendanceSearch"
                        type="search"
                        x-model="searchQuery"
                        @input="onSearchChange()"
                        :disabled="tableState.loading"
                        placeholder="Cari nama atau NIP/NIM..."
                        class="focus:border-brand-500 focus:ring-brand-500/20 block w-full rounded-lg border border-gray-300 bg-white py-2.5 pr-3 pl-10 text-sm text-gray-900 placeholder-gray-500 transition focus:ring-4 focus:outline-none disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder-gray-400"
                      />
                    </div>

                    <include
                      src="./partials/table/attendance-table-filter.html"
                    ></include>
                  </div>

                  <!-- Entries per page -->
                  <div
                    class="flex items-center justify-between gap-2 sm:justify-end"
                  >
                    <label
                      for="attendancePageSize"
                      class="text-sm font-medium text-gray-700 dark:text-gray-300"
                      >Baris:</label
                    >
                    <select
                      id="attendancePageSize"
                      x-model="appliedQuery.limit"
                      @change="changeLimit(appliedQuery.limit)"
                      :disabled="tableState.loading"
                      class="focus:border-brand-500 focus:ring-brand-500/20 rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 focus:ring-4 focus:outline-none disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                    >
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Attendance Table -->
              <div
                class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-900"
              >
                <include src="./partials/table/table-attendance.html"></include>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <!-- Map Detail Modal -->
    <include src="./partials/modal/map-detail-modal.html"></include>

    <!-- Alert Modal -->
    <include src="./partials/modal/modal-alert.html"></include>
  </body>
</html>
