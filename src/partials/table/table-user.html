<!-- ====== User Table Section Start -->

<!-- Loading Spinner -->
<div x-show="isLoading" class="flex items-center justify-center py-12">
  <div class="flex items-center space-x-3">
    <div
      class="border-t-primary h-8 w-8 animate-spin rounded-full border-4 border-gray-300"
    ></div>
    <span class="text-sm text-gray-600 dark:text-gray-400"
      >Memuat data pengguna...</span
    >
  </div>
</div>

<!-- Error Message -->
<div
  x-show="errorMessage && !isLoading"
  class="bg-error-50 dark:bg-error-500/15 rounded-lg p-4"
>
  <div class="flex items-center">
    <svg
      class="text-error-600 dark:text-error-400 mr-3 h-5 w-5"
      fill="currentColor"
      viewBox="0 0 20 20"
    >
      <path
        fill-rule="evenodd"
        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
        clip-rule="evenodd"
      ></path>
    </svg>
    <span
      class="text-error-700 dark:text-error-300 text-sm"
      x-text="errorMessage"
    ></span>
  </div>
</div>

<!-- Main Card: header band + table + pagination (TailAdmin "Table Four" style) -->
<div
  x-show="!isLoading && !errorMessage"
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white pt-4 dark:border-gray-800 dark:bg-white/[0.03]"
>
  <!-- Header band: search (title's former spot) + filter slot + Tambah User -->
  <div
    class="mb-4 flex flex-col gap-5 px-6 sm:flex-row sm:items-center sm:justify-between"
  >
    <!-- Search Input (takes the place of the removed card title; the
         page-level breadcrumb still carries that label) -->
    <div class="relative">
      <span
        class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2"
      >
        <svg
          class="h-5 w-5 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
      </span>
      <input
        type="text"
        placeholder="Cari berdasarkan nama, email, atau NIP..."
        x-model="searchQuery"
        @input="onSearchChange()"
        class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-200 bg-transparent py-2.5 pr-4 pl-12 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden xl:w-[300px] dark:border-gray-800 dark:bg-white/[0.03] dark:text-white/90 dark:placeholder:text-white/30"
      />
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
      <include src="./user-table-filter.html"></include>

      <!-- Add User Button -->
      <a
        href="form-user.html"
        class="hover:bg-opacity-90 bg-brand-500 inline-flex items-center justify-center rounded-lg px-4 py-2.5 text-center text-sm font-medium text-white"
      >
        <svg
          class="mr-2 h-4 w-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6v6m0 0v6m0-6h6m-6 0H6"
          />
        </svg>
        Tambah User
      </a>
    </div>
  </div>

  <div class="border-t border-gray-100 dark:border-gray-800">
    <div class="custom-scrollbar max-w-full overflow-x-auto">
      <table class="min-w-full">
        <!-- Table Header -->
        <thead class="border-b border-gray-100 dark:border-gray-800">
          <tr>
            <!-- User ID column (owner decision: row checkbox removed as unused) -->
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  ID
                </p>
              </div>
            </th>
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Pengguna
                </p>
              </div>
            </th>
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  NIP/NIM
                </p>
              </div>
            </th>
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Akses
                </p>
              </div>
            </th>
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Organisasi
                </p>
              </div>
            </th>
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Lokasi WFH
                </p>
              </div>
            </th>
            <th class="px-6 py-3 whitespace-nowrap">
              <div class="flex items-center justify-center">
                <p
                  class="text-theme-xs font-medium text-gray-500 dark:text-gray-400"
                >
                  Aksi
                </p>
              </div>
            </th>
          </tr>
        </thead>

        <!-- Table Body -->
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          <!-- Empty State -->
          <tr x-show="!isLoading && paginatedUsers.length === 0">
            <td
              colspan="7"
              class="px-6 py-12 text-center text-sm text-gray-500 dark:text-gray-400"
            >
              <div class="flex flex-col items-center gap-3">
                <svg
                  class="h-12 w-12 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"
                  ></path>
                </svg>
                <div class="text-center">
                  <span x-show="searchQuery"
                    >No users found matching your search.</span
                  >
                  <span x-show="!searchQuery">No users available.</span>
                </div>
              </div>
            </td>
          </tr>

          <!-- User Rows -->
          <template x-for="user in paginatedUsers" :key="user.id">
            <tr>
              <!-- User ID (owner decision: row checkbox removed as unused) -->
              <td class="px-6 py-3 whitespace-nowrap">
                <span
                  class="text-theme-sm font-medium text-gray-700 dark:text-gray-400"
                  x-text="user.id"
                ></span>
              </td>

              <!-- Pengguna: avatar (photo if available, else initials) + full name + email -->
              <td class="px-6 py-3 whitespace-nowrap">
                <div class="flex items-center gap-3">
                  <template x-if="user.photo">
                    <img
                      :src="getUserPhotoUrl(user.photo)"
                      alt=""
                      class="h-10 w-10 rounded-full object-cover"
                      @error="user.photo = null"
                      loading="lazy"
                    />
                  </template>
                  <template x-if="!user.photo">
                    <div
                      class="flex h-10 w-10 items-center justify-center rounded-full text-sm font-medium"
                      :class="user.avatarColor"
                    >
                      <span x-text="user.initials"></span>
                    </div>
                  </template>
                  <div>
                    <p
                      class="text-theme-sm font-medium text-gray-800 dark:text-white/90"
                      x-text="user.fullName"
                    ></p>
                    <span
                      class="text-theme-xs text-gray-500 dark:text-gray-400"
                      x-text="user.email"
                    ></span>
                  </div>
                </div>
              </td>

              <!-- NIP/NIM -->
              <td class="px-6 py-3 whitespace-nowrap">
                <span
                  class="text-theme-sm text-gray-500 dark:text-gray-400"
                  x-text="user.nipNim || '-'"
                ></span>
              </td>

              <!-- Akses: role badge (color is supplementary; status is text-carried) -->
              <td class="px-6 py-3 whitespace-nowrap">
                <span
                  class="text-theme-xs rounded-full px-2 py-0.5 font-medium"
                  :class="roleBadgeClass(user.role)"
                  x-text="user.role || '-'"
                ></span>
              </td>

              <!-- Organisasi: position + division -->
              <td class="px-6 py-3 whitespace-nowrap">
                <p
                  class="text-theme-sm text-gray-800 dark:text-white/90"
                  x-text="user.position || '-'"
                ></p>
                <span
                  class="text-theme-xs text-gray-500 dark:text-gray-400"
                  x-text="user.division || '-'"
                ></span>
              </td>

              <!-- Lokasi WFH (unchanged from INF-247: text-carried status badge) -->
              <td class="px-6 py-3 whitespace-nowrap">
                <span
                  class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-medium"
                  :class="wfhStatusFor(user) === 'Tersedia' ? 'bg-success-50 text-success-700 dark:bg-success-500/15 dark:text-success-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'"
                  x-text="wfhStatusFor(user)"
                ></span>
              </td>

              <!-- Aksi: Detail / Edit / Delete (unchanged from INF-247) -->
              <td class="px-6 py-3 whitespace-nowrap">
                <div class="flex items-center justify-center space-x-3">
                  <!-- Detail Button -->
                  <button
                    type="button"
                    @click="openUserDetailDrawer(user)"
                    :aria-label="`Lihat detail pengguna ${user.fullName}`"
                    class="focus:ring-brand-500 inline-flex h-8 w-8 items-center justify-center rounded-lg bg-blue-100 text-blue-600 transition-colors hover:bg-blue-200 focus:ring-2 focus:outline-none dark:bg-blue-900/50 dark:text-blue-400 dark:hover:bg-blue-800/50"
                    title="Detail Pengguna"
                  >
                    <svg
                      class="h-4 w-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      ></path>
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      ></path>
                    </svg>
                  </button>
                  <!-- Edit Button -->
                  <a
                    :href="`form-user.html?id=${user.id}`"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-100 text-indigo-600 transition-colors hover:bg-indigo-200 dark:bg-indigo-900/50 dark:text-indigo-400 dark:hover:bg-indigo-800/50"
                    title="Edit User"
                  >
                    <svg
                      class="h-4 w-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                      ></path>
                    </svg>
                  </a>
                  <!-- Delete Button -->
                  <button
                    @click="showDeleteModal(user)"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-red-100 text-red-600 transition-colors hover:bg-red-200 dark:bg-red-900/50 dark:text-red-400 dark:hover:bg-red-800/50"
                    title="Delete User"
                  >
                    <svg
                      class="h-4 w-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                      ></path>
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between px-6 py-3">
      <!-- Results Info -->
      <div class="flex flex-1 justify-between sm:hidden">
        <button
          @click="goToPage(currentPage - 1)"
          :disabled="currentPage <= 1"
          :class="currentPage > 1 ? 'hover:bg-gray-50 dark:hover:bg-white/[0.03] text-gray-700 dark:text-gray-300' : 'text-gray-400 dark:text-gray-600 cursor-not-allowed'"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium dark:border-gray-700 dark:bg-white/[0.03]"
        >
          Previous
        </button>
        <button
          @click="goToPage(currentPage + 1)"
          :disabled="currentPage >= totalPages"
          :class="currentPage < totalPages ? 'hover:bg-gray-50 dark:hover:bg-white/[0.03] text-gray-700 dark:text-gray-300' : 'text-gray-400 dark:text-gray-600 cursor-not-allowed'"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium dark:border-gray-700 dark:bg-white/[0.03]"
        >
          Next
        </button>
      </div>

      <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <div class="flex items-center gap-4">
          <!-- Show entries (moved here from the header band) -->
          <div class="flex items-center gap-2">
            <label class="text-sm font-medium text-gray-700 dark:text-gray-300"
              >Show</label
            >
            <select
              x-model="entriesPerPage"
              @change="onEntriesPerPageChange()"
              class="focus:ring-brand-500 focus:border-brand-500 rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:ring-1 focus:outline-none dark:border-gray-700 dark:bg-white/[0.03] dark:text-white/90"
            >
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="text-sm text-gray-700 dark:text-gray-300"
              >entries</span
            >
          </div>

          <p
            class="text-sm text-gray-700 dark:text-gray-300"
            x-text="showingInfo"
          ></p>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Previous Button -->
          <button
            @click="goToPage(currentPage - 1)"
            :disabled="currentPage <= 1"
            :class="currentPage > 1 ? 'hover:bg-gray-50 dark:hover:bg-white/[0.03] text-gray-700 dark:text-gray-300' : 'text-gray-400 dark:text-gray-600 cursor-not-allowed'"
            class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium dark:border-gray-700 dark:bg-white/[0.03]"
          >
            Previous
          </button>

          <!-- Page Numbers -->
          <template
            x-for="pageNum in Array.from({length: Math.min(5, totalPages)}, (_, i) => Math.max(1, currentPage - 2) + i).filter(num => num <= totalPages)"
            :key="pageNum"
          >
            <button
              @click="goToPage(pageNum)"
              :class="pageNum === currentPage ? 'bg-brand-500 text-white border-brand-500' : 'bg-white dark:bg-white/[0.03] text-gray-700 dark:text-gray-300 border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-white/[0.05]'"
              class="rounded-lg border px-4 py-2 text-sm font-medium"
              x-text="pageNum"
            ></button>
          </template>

          <!-- Next Button -->
          <button
            @click="goToPage(currentPage + 1)"
            :disabled="currentPage >= totalPages"
            :class="currentPage < totalPages ? 'hover:bg-gray-50 dark:hover:bg-white/[0.03] text-gray-700 dark:text-gray-300' : 'text-gray-400 dark:text-gray-600 cursor-not-allowed'"
            class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium dark:border-gray-700 dark:bg-white/[0.03]"
          >
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div
  x-show="isDeleteModalOpen"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-md"
  style="display: none"
>
  <div
    @click.away="closeDeleteModal()"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 transform scale-95 translate-y-4"
    x-transition:enter-end="opacity-100 transform scale-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 transform scale-100 translate-y-0"
    x-transition:leave-end="opacity-0 transform scale-95 translate-y-4"
    class="relative mx-4 w-full max-w-md overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl dark:border-gray-700 dark:bg-gray-800"
  >
    <!-- Modal Header with Icon -->
    <div
      class="relative border-b border-red-200 bg-gradient-to-r from-red-50 to-red-100 px-6 py-6 dark:border-red-700/50 dark:from-red-900/20 dark:to-red-800/20"
    >
      <div class="flex items-start">
        <div class="flex-shrink-0">
          <div
            class="flex h-12 w-12 items-center justify-center rounded-full bg-red-100 ring-4 ring-red-50 dark:bg-red-900/50 dark:ring-red-900/30"
          >
            <svg
              class="h-6 w-6 text-red-600 dark:text-red-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              ></path>
            </svg>
          </div>
        </div>
        <div class="ml-4 flex-1">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
            Konfirmasi Hapus Pengguna
          </h3>
          <p class="mt-1 text-sm text-red-600 dark:text-red-400">
            Tindakan ini tidak dapat dibatalkan
          </p>
        </div>
      </div>
    </div>

    <!-- Modal Body -->
    <div class="px-6 py-6">
      <!-- User Info Display -->
      <div
        class="mb-4 flex items-center rounded-xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-600 dark:bg-gray-700/50"
      >
        <div
          class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full text-sm font-medium"
          :class="userToDelete ? getAvatarColor(userToDelete.fullName) : 'bg-gray-100 text-gray-600'"
        >
          <span
            x-text="userToDelete ? getInitials(userToDelete.fullName) : 'U'"
          ></span>
        </div>
        <div class="ml-4 min-w-0 flex-1">
          <p
            class="truncate text-base font-medium text-gray-900 dark:text-white"
            x-text="userToDelete?.fullName || 'Pengguna'"
          ></p>
          <p
            class="truncate text-sm text-gray-500 dark:text-gray-400"
            x-text="userToDelete?.email || ''"
          ></p>
          <div class="mt-1 flex items-center">
            <span
              class="inline-flex items-center rounded bg-blue-100 px-2 py-0.5 text-xs font-medium text-blue-800 dark:bg-blue-900/50 dark:text-blue-300"
            >
              <span x-text="userToDelete?.role || 'User'"></span>
            </span>
            <span
              class="ml-2 text-xs text-gray-500 dark:text-gray-400"
              x-text="userToDelete?.nipNim ? `NIP: ${userToDelete.nipNim}` : ''"
            ></span>
          </div>
        </div>
      </div>

      <!-- Confirmation Text -->
      <div class="mt-4">
        <p class="text-center text-sm text-gray-600 dark:text-gray-300">
          Ketik
          <span
            class="rounded bg-gray-100 px-2 py-1 font-mono font-medium text-red-600 dark:bg-gray-700 dark:text-red-400"
            >HAPUS</span
          >
          untuk mengonfirmasi
        </p>
        <input
          type="text"
          x-model="deleteConfirmText"
          placeholder="Ketik HAPUS untuk mengonfirmasi"
          class="mt-2 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-500 focus:border-red-500 focus:ring-2 focus:ring-red-500 focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"
        />
      </div>
    </div>

    <!-- Modal Footer -->
    <div
      class="border-t border-gray-200 bg-gray-50 px-6 py-4 dark:border-gray-700 dark:bg-gray-800/50"
    >
      <div class="flex justify-end space-x-3">
        <button
          @click="closeDeleteModal()"
          :disabled="isDeleting"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors duration-200 hover:bg-gray-50 focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600"
        >
          Batal
        </button>
        <button
          @click="confirmDeleteUser()"
          :disabled="isDeleting || deleteConfirmText !== 'HAPUS'"
          class="flex items-center rounded-lg border border-transparent bg-red-600 px-4 py-2.5 text-sm font-medium text-white transition-all duration-200 hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
        >
          <svg
            x-show="isDeleting"
            class="mr-2 -ml-1 h-4 w-4 animate-spin text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
