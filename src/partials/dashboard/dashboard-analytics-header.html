<div
  class="mb-8 flex flex-col justify-between gap-4 xl:flex-row xl:items-center"
>
  <h3 class="text-2xl font-semibold text-gray-900 dark:text-white">
    Dashboard Analytics
  </h3>

  <div
    class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center xl:justify-end"
  >
    <div class="relative" @click.outside="closeDashboardRangeDropdown()">
      <button
        type="button"
        @click="toggleDashboardRangeDropdown()"
        class="shadow-theme-xs flex h-11 items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]"
      >
        <span x-text="dashboardHeaderState.selectedLabel"></span>
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          :class="dashboardHeaderState.isDropdownOpen ? 'rotate-180' : ''"
          class="transition-transform"
        >
          <path
            d="M4.3125 7.21875L9 11.9063L13.6875 7.21875"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>

      <div
        x-show="dashboardHeaderState.isDropdownOpen"
        class="absolute right-0 z-50 mt-1.5 w-38 rounded-xl border border-gray-200 bg-white p-1.5 shadow-lg dark:border-gray-700 dark:bg-gray-900"
      >
        <template x-for="option in dashboardRangeOptions" :key="option.value">
          <button
            type="button"
            @click="selectDashboardRangeOption(option.value)"
            class="w-full rounded-lg px-2.5 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
            :class="dashboardRange === option.value ? 'bg-gray-100 font-medium dark:bg-white/5' : 'font-normal'"
            x-text="option.label"
          ></button>
        </template>
      </div>
    </div>

    <div class="relative max-w-72 min-w-[240px]">
      <input
        x-ref="dashboardAnalyticsDatePicker"
        type="text"
        readonly
        class="datepicker text-theme-sm shadow-theme-xs h-11 w-full rounded-lg border border-gray-200 bg-white py-3 pr-4 pl-11 font-medium text-gray-700 focus:ring-0 focus:outline-hidden focus-visible:outline-hidden dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
        :value="dashboardHeaderState.pickerInputValue"
        :placeholder="dashboardHeaderState.pickerPlaceholder"
        data-class="flatpickr-right"
        title="Select custom dashboard analytics range"
        @click="setDashboardRangePreset('custom')"
      />
      <div
        class="pointer-events-none absolute inset-0 right-auto left-4 flex items-center"
      >
        <svg
          class="fill-gray-700 dark:fill-gray-400"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M6.66683 1.54199C7.08104 1.54199 7.41683 1.87778 7.41683 2.29199V3.00033H12.5835V2.29199C12.5835 1.87778 12.9193 1.54199 13.3335 1.54199C13.7477 1.54199 14.0835 1.87778 14.0835 2.29199V3.00033L15.4168 3.00033C16.5214 3.00033 17.4168 3.89576 17.4168 5.00033V7.50033V15.8337C17.4168 16.9382 16.5214 17.8337 15.4168 17.8337H4.5835C3.47893 17.8337 2.5835 16.9382 2.5835 15.8337V7.50033V5.00033C2.5835 3.89576 3.47893 3.00033 4.5835 3.00033L5.91683 3.00033V2.29199C5.91683 1.87778 6.25262 1.54199 6.66683 1.54199ZM6.66683 4.50033H4.5835C4.30735 4.50033 4.0835 4.72418 4.0835 5.00033V6.75033H15.9168V5.00033C15.9168 4.72418 15.693 4.50033 15.4168 4.50033H13.3335H6.66683ZM15.9168 8.25033H4.0835V15.8337C4.0835 16.1098 4.30735 16.3337 4.5835 16.3337H15.4168C15.693 16.3337 15.9168 16.1098 15.9168 15.8337V8.25033Z"
            fill=""
          />
        </svg>
      </div>
    </div>

    <button
      @click="openExportModal()"
      :disabled="isExporting"
      class="bg-brand-500 hover:bg-brand-600 focus:ring-brand-500 shadow-theme-xs flex items-center gap-2 rounded-lg px-4 py-3 text-sm font-medium text-white transition-colors focus:shadow-[0_0_0_3px_rgba(59,130,246,0.1)] focus:ring-2 focus:ring-offset-2 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50 dark:focus:ring-offset-gray-900"
      :title="`Export Attendance Report (${dashboardRange})`"
    >
      <svg
        class="fill-current"
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M10 2.5C10.4142 2.5 10.75 2.83579 10.75 3.25V9.75L12.4697 8.03033C12.7626 7.73744 13.2374 7.73744 13.5303 8.03033C13.8232 8.32322 13.8232 8.79809 13.5303 9.09099L10.5303 12.091C10.2374 12.3839 9.76256 12.3839 9.46967 12.091L6.46967 9.09099C6.17678 8.79809 6.17678 8.32322 6.46967 8.03033C6.76256 7.73744 7.23744 7.73744 7.53033 8.03033L9.25 9.75V3.25C9.25 2.83579 9.58579 2.5 10 2.5Z"
        />
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M3.75 12.25C4.16421 12.25 4.5 12.5858 4.5 13V15C4.5 15.1989 4.57902 15.3897 4.71967 15.5303C4.86032 15.671 5.05109 15.75 5.25 15.75H14.75C14.9489 15.75 15.1397 15.671 15.2803 15.5303C15.421 15.3897 15.5 15.1989 15.5 15V13C15.5 12.5858 15.8358 12.25 16.25 12.25C16.6642 12.25 17 12.5858 17 13V15C17 15.5967 16.7629 16.169 16.341 16.591C15.919 17.0129 15.3467 17.25 14.75 17.25H5.25C4.65326 17.25 4.08097 17.0129 3.65901 16.591C3.23705 16.169 3 15.5967 3 15V13C3 12.5858 3.33579 12.25 3.75 12.25Z"
        />
      </svg>
      <span x-text="isExporting ? 'Exporting...' : 'Export'"></span>
    </button>
  </div>
</div>
