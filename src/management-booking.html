<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Management Booking | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  </head>
  <body
    x-data="{ 
      page: 'managementBooking',      'loaded': true, 
      'darkMode': false, 
      'stickyMenu': false, 
      'sidebarToggle': false, 
      'scrollTop': false,
      ...window.bookingListAlpineData()
    }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
    @wfa-booking-rejection:succeeded.window="handleRejectionSucceeded($event.detail)"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/common/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/common/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/common/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Management Booking`}">
              <include src="./partials/common/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Inline Alert Templates & Container -->
            <include src="./partials/alert/alert-templates.html" />
            <div id="alert-container"></div>

            <div class="space-y-5 sm:space-y-6">
              <!-- Search and Filter Controls -->
              <div
                class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-900"
              >
                <div
                  class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
                >
                  <!-- Left side: Search Input and Status Filter -->
                  <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
                    <!-- Search Input -->
                    <div class="relative max-w-md flex-1">
                      <div
                        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
                      >
                        <svg
                          class="h-5 w-5 text-gray-400"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                          ></path>
                        </svg>
                      </div>
                      <input
                        type="text"
                        x-model="searchTerm"
                        @input="debouncedSearch()"
                        placeholder="Cari berdasarkan nama, ID, atau posisi..."
                        class="focus:ring-primary focus:border-primary block w-full rounded-md border border-gray-300 bg-white py-2 pr-3 pl-10 leading-5 placeholder-gray-500 focus:placeholder-gray-400 focus:ring-1 focus:outline-none dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder-gray-400"
                      />
                    </div>

                    <!-- Status Filter -->
                    <div class="flex items-center gap-2">
                      <label
                        class="text-sm font-medium text-gray-700 dark:text-gray-300"
                        >Status:</label
                      >
                      <select
                        x-model="statusFilter"
                        @change="applyFilters()"
                        class="focus:ring-primary focus:border-primary rounded-md border border-gray-300 px-3 py-2 text-sm focus:ring-1 focus:outline-none dark:border-gray-600 dark:bg-gray-800 dark:text-white"
                      >
                        <option value="">Semua Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                      </select>
                    </div>
                  </div>

                  <!-- Right side: Entries per page -->
                  <div class="flex items-center gap-2">
                    <label
                      class="text-sm font-medium text-gray-700 dark:text-gray-300"
                      >Show:</label
                    >
                    <select
                      x-model="filters.limit"
                      @change="changeLimit(filters.limit)"
                      class="focus:ring-primary focus:border-primary rounded-md border border-gray-300 px-3 py-2 text-sm focus:ring-1 focus:outline-none dark:border-gray-600 dark:bg-gray-800 dark:text-white"
                    >
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                    <span class="text-sm text-gray-700 dark:text-gray-300"
                      >entries</span
                    >
                  </div>
                </div>
              </div>

              <!-- Work From Anywhere Booking Table -->
              <div
                class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-900"
              >
                <include src="./partials/table/table-booking.html"></include>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
    <!-- ===== Booking Map Modal Start ===== -->
    <include src="./partials/modal/booking-map-modal.html"></include>
    <!-- ===== Booking Map Modal End ===== -->
    <include src="./partials/modal/wfa-booking-rejection-modal.html"></include>
  </body>
</html>
