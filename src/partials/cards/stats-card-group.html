<div
  class="rounded-3xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-white/[0.03]"
>
  <include src="../dashboard/dashboard-analytics-header.html"></include>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-4">
    <template x-for="card in cockpit.kpis" :key="card.key">
      <section
        class="flex flex-col rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]"
      >
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <span
              class="text-sm font-medium text-gray-500 dark:text-gray-400"
              x-text="card.title"
            ></span>
          </div>
          <span
            class="inline-flex h-6 w-6 items-center justify-center"
            :class="getCockpitKpiIconClass(card)"
            x-html="getCockpitKpiIconSvg(card.meta.icon)"
          ></span>
        </div>
        <h2
          class="mb-2 text-3xl font-semibold text-gray-800 dark:text-white/90"
          x-text="getCockpitKpiDisplayValue(card)"
        ></h2>
        <p
          class="mb-4 min-h-[72px] text-sm leading-6 text-gray-500 dark:text-gray-400"
          x-text="getCockpitKpiSupportText(card)"
        ></p>
        <div class="mt-auto flex items-center justify-between gap-3">
          <span
            class="text-sm text-gray-500 dark:text-gray-400"
            x-text="getDashboardRangeLabel()"
          ></span>
          <span
            class="flex items-center gap-1 text-sm font-medium"
            :class="getCockpitKpiFooterClass(card)"
          >
            <span
              class="inline-flex h-4 w-4 items-center justify-center"
              x-html="getCockpitKpiStateIconSvg(card)"
            ></span>
            <span x-text="getCockpitKpiFooterLabel(card)"></span>
          </span>
        </div>
      </section>
    </template>
  </div>

  <include src="../modal/export-report-modal.html" />
</div>
