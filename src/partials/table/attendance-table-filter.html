<div class="relative shrink-0">
  <button
    id="attendanceTableFilterTrigger"
    type="button"
    @click="openFilter()"
    :aria-expanded="isFilterOpen"
    aria-controls="attendanceTableFilterPopover"
    class="focus:ring-brand-500/20 inline-flex w-full items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:ring-4 focus:outline-none sm:w-auto dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-white/5"
  >
    <svg
      class="h-4 w-4"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M3 4a1 1 0 011-1h16a1 1 0 01.8 1.6l-6.2 8.267V19a1 1 0 01-.553.894l-4 2A1 1 0 019 21v-8.133L2.8 4.6A1 1 0 013 4z"
      ></path>
    </svg>
    Filter
    <span
      x-show="activeFilterCount > 0"
      x-text="activeFilterCount"
      class="bg-brand-500 inline-flex min-w-5 items-center justify-center rounded-full px-1.5 py-0.5 text-xs font-semibold text-white"
      aria-label="Filter aktif"
    ></span>
  </button>

  <div
    id="attendanceTableFilterPopover"
    x-cloak
    x-show="isFilterOpen"
    x-transition.opacity.duration.150ms
    @click.outside="closeFilter()"
    @keydown.escape.window="closeFilter()"
    class="absolute top-full right-0 z-50 mt-2 w-[calc(100vw-2rem)] max-w-md overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl max-sm:fixed max-sm:inset-x-4 max-sm:top-20 max-sm:z-99999 sm:w-[24rem] dark:border-gray-700 dark:bg-gray-900"
    role="dialog"
    aria-modal="false"
    aria-labelledby="attendanceFilterTitle"
  >
    <div
      class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-700"
    >
      <div>
        <h2
          id="attendanceFilterTitle"
          class="text-sm font-semibold text-gray-900 dark:text-white"
        >
          Filter kehadiran
        </h2>
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
          Gabungkan periode dan atribut audit.
        </p>
      </div>
      <button
        type="button"
        @click="closeFilter()"
        class="rounded-lg p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-700 focus:outline-none dark:hover:bg-white/5 dark:hover:text-gray-200"
        aria-label="Tutup filter"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="max-h-[65vh] space-y-4 overflow-y-auto p-4">
      <fieldset>
        <legend
          class="mb-2 text-sm font-medium text-gray-700 dark:text-gray-300"
        >
          Rentang tanggal
        </legend>
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label
              for="attendanceFilterFrom"
              class="mb-1 block text-xs text-gray-500 dark:text-gray-400"
              >Mulai</label
            >
            <input
              id="attendanceFilterFrom"
              type="date"
              x-model="draftFilters.from"
              class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:ring-4 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
          </div>
          <div>
            <label
              for="attendanceFilterTo"
              class="mb-1 block text-xs text-gray-500 dark:text-gray-400"
              >Selesai</label
            >
            <input
              id="attendanceFilterTo"
              type="date"
              x-model="draftFilters.to"
              class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:ring-4 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
          </div>
        </div>
      </fieldset>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label
            for="attendanceFilterMode"
            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Mode</label
          >
          <select
            id="attendanceFilterMode"
            x-model="draftFilters.mode"
            class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:ring-4 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
          >
            <option value="">Semua mode</option>
            <option value="wfo">WFO</option>
            <option value="wfh">WFH</option>
            <option value="wfa">WFA</option>
          </select>
        </div>

        <div>
          <label
            for="attendanceFilterStatus"
            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Status</label
          >
          <select
            id="attendanceFilterStatus"
            x-model="draftFilters.status"
            class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:ring-4 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
          >
            <option value="">Semua status</option>
            <option value="ontime">Tepat waktu</option>
            <option value="late">Terlambat</option>
            <option value="early">Pulang awal</option>
            <option value="alpha">Alpha</option>
          </select>
        </div>
      </div>

      <div>
        <label
          for="attendanceFilterCheckout"
          class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >Status checkout</label
        >
        <select
          id="attendanceFilterCheckout"
          x-model="draftFilters.checkoutState"
          class="focus:border-brand-500 focus:ring-brand-500/20 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:ring-4 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"
        >
          <option value="">Semua checkout</option>
          <option value="completed">Selesai</option>
          <option value="open">Belum checkout</option>
        </select>
      </div>

      <p
        x-show="filterValidationMessage"
        x-text="filterValidationMessage"
        role="alert"
        class="bg-error-50 text-error-700 dark:bg-error-500/15 dark:text-error-300 rounded-lg px-3 py-2 text-sm"
      ></p>

      <div
        x-show="tableState.loading"
        class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400"
        aria-live="polite"
      >
        <span
          class="border-brand-500 h-3.5 w-3.5 animate-spin rounded-full border-2 border-t-transparent"
        ></span>
        Memperbarui hasil...
      </div>
      <div
        x-show="tableState.error"
        class="bg-error-50 dark:bg-error-500/15 flex items-center justify-between gap-3 rounded-lg px-3 py-2"
      >
        <span class="text-error-700 dark:text-error-300 text-xs"
          >Hasil terakhir gagal diperbarui.</span
        >
        <button
          type="button"
          @click="fetchAttendance()"
          class="text-error-700 dark:text-error-300 text-xs font-semibold underline"
        >
          Coba lagi
        </button>
      </div>
    </div>

    <div
      class="flex flex-col-reverse gap-2 border-t border-gray-200 bg-gray-50 px-4 py-3 sm:flex-row sm:justify-end dark:border-gray-700 dark:bg-gray-800/50"
    >
      <button
        type="button"
        @click="clearFilters()"
        :disabled="tableState.loading"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:cursor-wait disabled:opacity-60 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:bg-white/5"
      >
        Bersihkan
      </button>
      <button
        type="button"
        @click="applyFilters()"
        :disabled="tableState.loading"
        class="bg-brand-500 hover:bg-brand-600 rounded-lg px-4 py-2 text-sm font-medium text-white disabled:cursor-wait disabled:opacity-60"
      >
        Terapkan filter
      </button>
    </div>
  </div>
</div>
