<div
  class="rounded-3xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-white/[0.03]"
  x-data="{
    get viewState() {
      return getGeofenceEvidenceViewState(panel);
    }
  }"
>
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h4
        class="text-xl font-semibold leading-tight tracking-[-0.025em] text-gray-900 dark:text-white"
        x-text="viewState.title"
      ></h4>
    </div>

    <span class="inline-flex w-fit items-center gap-2 rounded-full bg-success-50 px-3 py-1 text-xs font-semibold text-success-700 dark:bg-success-500/15 dark:text-success-400">
      <span class="h-2 w-2 rounded-full bg-success-500"></span>
      <span x-text="viewState.statusLabel"></span>
    </span>
  </div>

  <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <template x-for="card in viewState.statCards" :key="card.key">
      <div class="rounded-2xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-brand-50 text-brand-500 shadow-[0_8px_18px_rgba(70,95,255,0.16)] dark:bg-brand-500/15 dark:text-brand-300">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path :d="card.iconPath" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <div class="min-w-0">
            <p
              class="truncate text-[11px] font-semibold text-gray-600 dark:text-gray-300"
              x-text="card.title"
            ></p>
            <p
              class="mt-1 text-3xl leading-none font-bold text-brand-500 dark:text-brand-400"
              x-text="card.value"
            ></p>
          </div>
        </div>
      </div>
    </template>
  </div>

  <div class="mt-4 rounded-2xl bg-gray-50 px-4 py-3 dark:bg-gray-900">
    <p class="text-sm font-medium text-gray-700 dark:text-gray-300">
      <span class="mr-2 text-xl font-bold text-brand-500 dark:text-brand-400" x-text="viewState.summaryLead"></span>
      <span x-text="viewState.summaryText"></span>
    </p>
  </div>

  <div class="mt-3 grid gap-3 xl:grid-cols-2">
    <template x-for="note in viewState.notes.slice(0, 2)" :key="note.key">
      <div class="flex items-center gap-3 rounded-xl bg-gray-50 px-4 py-3 text-sm font-medium text-gray-600 dark:bg-gray-900 dark:text-gray-300">
        <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-500 dark:bg-brand-500/15 dark:text-brand-300">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path :d="note.iconPath" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        <span x-text="note.label"></span>
      </div>
    </template>
  </div>

  <template x-if="viewState.notes[2]">
    <div class="mt-3 flex items-center gap-3 rounded-xl bg-gray-50 px-4 py-3 text-sm font-medium text-gray-600 dark:bg-gray-900 dark:text-gray-300">
      <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-500 dark:bg-brand-500/15 dark:text-brand-300">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path :d="viewState.notes[2].iconPath" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
      <span x-text="viewState.notes[2].label"></span>
    </div>
  </template>
</div>
