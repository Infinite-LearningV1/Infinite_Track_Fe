<div
  class="rounded-3xl border-0 bg-white px-4 py-3 shadow-sm sm:px-5 dark:bg-white/[0.03]"
  x-data="{ get viewState() { return getFuzzyAhpViewState(panel, fahpFilterState.type); } }"
>
  <div
    class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"
  >
    <div data-fahp-heading-row class="flex min-w-0 items-center gap-2">
      <h4
        class="text-xl leading-tight font-semibold tracking-[-0.025em] text-gray-900 dark:text-white"
      >
        Fuzzy AHP Decision Center
      </h4>
      <div data-fahp-status class="flex shrink-0 items-center">
        <span
          class="rounded-full px-2.5 py-1 text-xs font-medium"
          :class="{
          'bg-blue-50 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300': panel.state === 'loading',
          'bg-green-50 text-green-700 dark:bg-green-500/15 dark:text-green-300': panel.state === 'ready',
          'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300': panel.state === 'empty',
          'bg-amber-50 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300': panel.state === 'needsData',
          'bg-violet-50 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300': panel.state === 'backendRequired',
          'bg-red-50 text-red-700 dark:bg-red-500/15 dark:text-red-300': panel.state === 'error'
        }"
          x-text="panel.stateLabel"
        ></span>
      </div>
    </div>

    <nav
      class="flex max-w-full overflow-x-auto rounded-lg bg-gray-100 p-1 dark:bg-gray-900 [&::-webkit-scrollbar]:h-1.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-gray-200 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-track]:bg-white dark:[&::-webkit-scrollbar-track]:bg-transparent"
    >
      <template
        x-for="option in panel.data.typeOptions || []"
        :key="option.key"
      >
        <button
          type="button"
          class="inline-flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors duration-200 ease-in-out"
          :class="fahpFilterState.type === option.key ? 'bg-white text-gray-900 shadow-theme-xs dark:bg-white/[0.03] dark:text-white' : 'bg-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200'"
          @click="selectFahpType(option.key)"
          x-text="option.title"
        ></button>
      </template>
    </nav>
  </div>

  <template x-if="fahpFilterState.type === 'wfa' && viewState.requestedWindow">
    <div
      class="mt-4 rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-600 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-300"
    >
      WFA Analysis ·
      <span x-text="viewState.requestedWindow?.from || ''"></span> –
      <span x-text="viewState.requestedWindow?.to || ''"></span>
    </div>
  </template>

  <template x-if="panel.state === 'ready' && viewState.activeDecision">
    <div class="mt-3 max-w-full overflow-x-auto">
      <div class="fuzzy-ahp-card-grid">
        <section
          class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900"
        >
          <p class="text-xs font-semibold text-gray-800 dark:text-white/90">
            Consistency Check
          </p>

          <div class="mt-3 space-y-3">
            <div>
              <p
                class="text-[11px] font-medium text-gray-500 dark:text-gray-400"
              >
                CR Value
              </p>
              <p
                class="text-success-600 dark:text-success-500 mt-1 text-2xl leading-none font-bold"
                x-text="viewState.consistencyRatioLabel"
              ></p>
            </div>

            <div>
              <p
                class="text-[11px] font-medium text-gray-500 dark:text-gray-400"
              >
                Threshold
              </p>
              <p
                class="text-success-600 dark:text-success-500 mt-1 text-2xl leading-none font-bold"
                x-text="viewState.thresholdLabel"
              ></p>
            </div>

            <div>
              <p
                class="text-[11px] font-medium text-gray-500 dark:text-gray-400"
              >
                Konsistensi
              </p>
              <div class="mt-1 flex items-center gap-2">
                <p
                  class="text-xl leading-none font-bold"
                  :class="viewState.isConsistent ? 'text-success-600 dark:text-success-500' : 'text-amber-500 dark:text-amber-400'"
                  x-text="viewState.consistencyStatusLabel"
                ></p>
                <span
                  x-show="viewState.isConsistent !== null"
                  class="inline-flex h-5 w-5 items-center justify-center rounded-full text-white"
                  :class="viewState.isConsistent ? 'bg-success-500' : 'bg-amber-500'"
                >
                  <svg
                    class="h-3 w-3"
                    viewBox="0 0 16 16"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M4 8.25L6.7 11L12 5.5"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </section>

        <section
          class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900"
        >
          <p class="text-xs font-semibold text-gray-800 dark:text-white/90">
            Criteria Weights
          </p>

          <div class="mt-3 space-y-2.5">
            <template
              x-for="criterion in viewState.criteriaRows"
              :key="criterion.key"
            >
              <div
                class="grid grid-cols-[minmax(96px,1fr)_minmax(95px,1.05fr)_48px] items-center gap-2.5"
              >
                <p
                  class="truncate text-[11px] font-medium text-gray-600 dark:text-gray-300"
                  x-text="criterion.label"
                ></p>
                <div
                  class="h-2 overflow-hidden rounded-full bg-gray-100 dark:bg-[#233047]"
                >
                  <div
                    class="bg-brand-500 h-full rounded-full shadow-[0_0_10px_rgba(70,95,255,0.30)]"
                    :style="criterion.barStyle"
                  ></div>
                </div>
                <p
                  class="text-right text-[11px] font-semibold text-gray-700 dark:text-gray-200"
                  x-text="criterion.weightLabel"
                ></p>
              </div>
            </template>
          </div>
        </section>

        <section
          class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm dark:border-gray-700 dark:bg-gray-900"
        >
          <p class="text-xs font-semibold text-gray-800 dark:text-white/90">
            Ranking Preview (Top 5)
          </p>

          <ul
            class="mt-3 flex flex-col rounded-lg border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
          >
            <template
              x-for="ranking in viewState.rankingRows"
              :key="ranking.key"
            >
              <li
                class="flex items-center gap-2 border-b border-gray-200 px-3 py-2 text-sm text-gray-500 last:border-b-0 dark:border-gray-800 dark:text-gray-400"
              >
                <span
                  class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gray-100 text-xs font-semibold text-gray-600 dark:bg-gray-800 dark:text-gray-300"
                  x-text="ranking.rank"
                ></span>
                <div class="min-w-0 flex-1">
                  <span
                    class="block truncate text-xs font-medium text-gray-700 dark:text-gray-300"
                    x-text="ranking.label"
                  ></span>
                  <span
                    x-show="ranking.secondaryLabel"
                    class="block truncate text-[11px] text-gray-500 dark:text-gray-400"
                    x-text="ranking.secondaryLabel"
                  ></span>
                  <span
                    x-show="viewState.kind === 'wfa_date_range_analysis'"
                    class="block text-[10px] text-gray-400 dark:text-gray-500"
                    x-text="`${ranking.approvedBookingCount ?? 0} approved · ${ranking.analyzableBookingCount ?? 0} analyzable`"
                  ></span>
                </div>
                <span
                  class="shrink-0 text-right text-xs font-semibold text-gray-700 dark:text-gray-200"
                  x-text="ranking.scoreLabel"
                ></span>
                <span
                  x-show="viewState.kind === 'wfa_date_range_analysis' && ranking.criteriaSummary"
                  class="hidden text-[10px] text-gray-400 sm:block"
                  x-text="ranking.criteriaSummary ? `Tipe ${ranking.criteriaSummary.location_type_score} · Jarak ${ranking.criteriaSummary.distance_factor_score} · Fasilitas ${ranking.criteriaSummary.facility_score}` : ''"
                ></span>
              </li>
            </template>
          </ul>
        </section>
      </div>
    </div>
  </template>

  <template x-if="panel.state !== 'ready'">
    <div
      class="mt-4 rounded-2xl border border-dashed border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-900"
    >
      <p
        class="text-sm leading-6 text-gray-600 dark:text-gray-300"
        x-text="panel.message"
      ></p>
      <p
        class="mt-3 text-sm text-gray-500 dark:text-gray-400"
        x-text="panel.note"
      ></p>
    </div>
  </template>

  <template x-if="panel.state === 'ready'">
    <div
      class="mt-3 flex items-center justify-center gap-2 text-xs font-medium text-gray-500 dark:text-gray-400"
    >
      <span x-text="viewState.updatedAtLabel"></span>
      <span
        class="inline-flex h-4 w-4 items-center justify-center rounded-full border border-gray-300 text-[10px] dark:border-gray-600"
        >i</span
      >
    </div>
  </template>
</div>
