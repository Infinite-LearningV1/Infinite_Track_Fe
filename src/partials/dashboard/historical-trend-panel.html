<div
  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
  x-data="{
    get viewState() {
      return getHistoricalTrendViewState(panel);
    }
  }"
>
  <div class="px-6 py-5">
    <div
      class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between"
    >
      <div class="space-y-3">
        <h3
          class="text-xl leading-tight font-semibold tracking-[-0.025em] text-gray-900 dark:text-white"
          x-text="viewState.title"
        ></h3>
        <div
          class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm font-medium text-gray-500 dark:text-gray-400"
        >
          <template
            x-for="item in viewState.legendItems"
            :key="`${viewState.selectedRange.key}-${item.key}-legend`"
          >
            <span class="inline-flex items-center gap-2 whitespace-nowrap">
              <span
                class="h-2.5 w-2.5 shrink-0 rounded-full"
                :style="`background-color: ${item.color}`"
              ></span>
              <span x-text="item.label"></span>
            </span>
          </template>
        </div>
      </div>

      <template x-if="viewState.ranges.length > 1">
        <nav
          class="flex max-w-full overflow-x-auto rounded-lg bg-gray-100 p-1 dark:bg-gray-900 [&::-webkit-scrollbar]:h-1.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-gray-200 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-track]:bg-white dark:[&::-webkit-scrollbar-track]:bg-transparent"
        >
          <template x-for="range in viewState.ranges" :key="range.key">
            <button
              type="button"
              @click="trendRange = range.key; clearActiveTrendHover()"
              class="inline-flex items-center rounded-md px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors duration-200 ease-in-out"
              :class="viewState.selectedRange.key === range.key ? 'bg-white text-gray-900 shadow-theme-xs dark:bg-white/[0.03] dark:text-white' : 'bg-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200'"
              x-text="range.label"
            ></button>
          </template>
        </nav>
      </template>
    </div>
  </div>

  <div class="border-t border-gray-100 p-5 sm:p-6 dark:border-gray-800">
    <div class="custom-scrollbar max-w-full overflow-x-auto">
      <div id="chartEleven" class="min-w-[1000px]" style="min-height: 325px">
        <div class="relative h-[310px]">
          <svg
            viewBox="0 0 1000 310"
            class="h-[310px] w-full overflow-visible"
            role="img"
            :aria-label="viewState.isPreview ? 'Preview-only On Time, Late, and Alpha historical attendance trend chart' : 'Historical attendance trend chart for On Time, Late, and Alpha'"
          >
            <defs id="historicalTrendSvgDefs">
              <linearGradient
                id="historicalTrendOntimeGradient"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >
                <stop
                  stop-opacity="0.45"
                  stop-color="rgba(70,95,255,0.45)"
                  offset="0"
                ></stop>
                <stop
                  stop-opacity="0"
                  stop-color="rgba(255,255,255,0)"
                  offset="1"
                ></stop>
                <stop
                  stop-opacity="0"
                  stop-color="rgba(255,255,255,0)"
                  offset="1"
                ></stop>
              </linearGradient>
              <linearGradient
                id="historicalTrendLateGradient"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >
                <stop
                  stop-opacity="0.45"
                  stop-color="rgba(156,185,255,0.45)"
                  offset="0"
                ></stop>
                <stop
                  stop-opacity="0"
                  stop-color="rgba(255,255,255,0)"
                  offset="1"
                ></stop>
                <stop
                  stop-opacity="0"
                  stop-color="rgba(255,255,255,0)"
                  offset="1"
                ></stop>
              </linearGradient>
              <linearGradient
                id="historicalTrendAlphaGradient"
                x1="0"
                y1="0"
                x2="0"
                y2="1"
              >
                <stop
                  stop-opacity="0.45"
                  stop-color="rgba(239,68,68,0.45)"
                  offset="0"
                ></stop>
                <stop
                  stop-opacity="0"
                  stop-color="rgba(255,255,255,0)"
                  offset="1"
                ></stop>
                <stop
                  stop-opacity="0"
                  stop-color="rgba(255,255,255,0)"
                  offset="1"
                ></stop>
              </linearGradient>
            </defs>

            <g
              class="text-[11px] font-normal text-gray-500 dark:text-gray-400"
              x-html="viewState.yAxisMarkup"
            ></g>

            <g
              class="apex-like-trend-frame"
              style="transform: translate(46px, 30px)"
            >
              <path
                d="M 0 0 H 932"
                class="stroke-gray-100 dark:stroke-gray-800"
                stroke-width="1"
                fill="none"
              ></path>
              <path
                d="M 0 48 H 932"
                class="stroke-gray-100 dark:stroke-gray-800"
                stroke-width="1"
                fill="none"
              ></path>
              <path
                d="M 0 96 H 932"
                class="stroke-gray-100 dark:stroke-gray-800"
                stroke-width="1"
                fill="none"
              ></path>
              <path
                d="M 0 144 H 932"
                class="stroke-gray-100 dark:stroke-gray-800"
                stroke-width="1"
                fill="none"
              ></path>
              <path
                d="M 0 192 H 932"
                class="stroke-gray-100 dark:stroke-gray-800"
                stroke-width="1"
                fill="none"
              ></path>
              <path
                d="M 0 240 H 932"
                class="stroke-gray-200 dark:stroke-gray-700"
                stroke-width="1"
                fill="none"
              ></path>
              <g
                :transform="viewState.seriesTransform"
                x-html="viewState.seriesMarkup"
              ></g>
            </g>

            <g
              class="text-xs text-gray-500 dark:text-gray-400"
              x-html="viewState.xAxisMarkup"
            ></g>
          </svg>

          <div
            class="absolute inset-0"
            @mousemove="setActiveTrendHover(panel, $event)"
            @mouseleave="clearActiveTrendHover()"
          >
            <div
              x-show="viewState.activeHoverPoint"
              x-cloak
              class="pointer-events-none absolute w-px border-l border-dashed border-gray-300 dark:border-gray-600"
              :style="viewState.crosshairStyle"
            ></div>

            <template x-if="viewState.activeHoverPoint">
              <div class="pointer-events-none absolute inset-0">
                <template
                  x-for="item in viewState.activeHoverPoint.items"
                  :key="`${viewState.selectedRange.key}-${item.key}-marker`"
                >
                  <div
                    class="shadow-theme-sm absolute h-4 w-4 rounded-full border-2 border-white dark:border-gray-950"
                    :style="`${viewState.getMarkerStyle(item)}background-color:${item.color};`"
                  ></div>
                </template>
              </div>
            </template>

            <template x-if="viewState.activeHoverPoint">
              <div
                class="apexcharts-tooltip apexcharts-theme-light shadow-theme-sm pointer-events-none absolute z-10 min-w-[190px] rounded-lg border border-gray-200 bg-white p-0 text-xs text-gray-700 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-300"
                :style="viewState.tooltipStyle"
              >
                <div
                  class="apexcharts-tooltip-title border-b border-gray-100 px-3 py-2 font-medium text-gray-800 dark:border-gray-800 dark:text-white/90"
                  x-text="viewState.activeHoverPoint.label"
                ></div>
                <template
                  x-for="(item, index) in viewState.activeHoverPoint.items"
                  :key="`${viewState.selectedRange.key}-${item.key}-tooltip`"
                >
                  <div
                    class="apexcharts-tooltip-series-group apexcharts-active flex items-center gap-2 px-3 py-2"
                    :style="`order: ${index + 1}; display: flex;`"
                  >
                    <span
                      class="apexcharts-tooltip-marker h-1.5 w-1.5 shrink-0 rounded-full"
                      :style="`background-color: ${item.color}`"
                    ></span>
                    <div class="apexcharts-tooltip-text min-w-0 flex-1">
                      <div
                        class="apexcharts-tooltip-y-group flex items-center justify-between gap-5"
                      >
                        <span
                          class="apexcharts-tooltip-text-y-label truncate"
                          x-text="item.label"
                        ></span>
                        <span
                          class="apexcharts-tooltip-text-y-value font-semibold text-gray-900 dark:text-white"
                          x-text="item.value"
                        ></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
