<!-- Detail Absensi Drawer -->
<div
  x-show="isAttendanceDetailDrawerOpen"
  x-cloak
  class="fixed inset-0 z-99999"
  style="display: none"
  @keydown.escape.window="closeAttendanceDrawer()"
>
  <div
    class="fixed inset-0 bg-gray-400/50 backdrop-blur-[32px]"
    aria-hidden="true"
    @click="closeAttendanceDrawer()"
  ></div>

  <div
    x-ref="attendanceDetailDrawerPanel"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    aria-labelledby="attendanceDetailDrawerTitle"
    aria-describedby="attendanceDetailDrawerDescription"
    class="no-scrollbar fixed inset-y-0 right-0 flex w-full max-w-xl flex-col overflow-y-auto bg-white shadow-xl dark:bg-gray-900"
    x-transition:enter="transform transition duration-300 ease-out"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transform transition duration-200 ease-in"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    @keydown.tab="handleAttendanceDrawerTab($event)"
  >
    <div
      class="flex items-start justify-between border-b border-gray-200 p-5 sm:p-6 dark:border-gray-700"
    >
      <div>
        <h2
          id="attendanceDetailDrawerTitle"
          class="text-theme-xl font-semibold text-gray-800 dark:text-white/90"
        >
          Detail Absensi
        </h2>
        <p
          id="attendanceDetailDrawerDescription"
          class="mt-1 text-sm text-gray-500 dark:text-gray-400"
        >
          Bukti kehadiran lengkap dari catatan Backend.
        </p>
      </div>
      <button
        type="button"
        aria-label="Tutup detail absensi"
        class="focus:ring-brand-500 flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-500 transition-colors hover:bg-gray-200 hover:text-gray-700 focus:ring-2 focus:outline-none dark:bg-white/[0.05] dark:text-gray-400 dark:hover:bg-white/[0.07]"
        @click="closeAttendanceDrawer()"
      >
        <svg
          class="h-5 w-5 fill-current"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M6.04 16.54a1 1 0 001.42 1.42L12 13.41l4.54 4.55a1 1 0 001.42-1.42L13.41 12l4.55-4.54a1 1 0 00-1.42-1.42L12 10.59 7.46 6.04a1 1 0 00-1.42 1.42L10.59 12l-4.55 4.54z"
          />
        </svg>
      </button>
    </div>

    <div class="flex-1 p-5 sm:p-6">
      <div
        x-show="detailState.loading"
        class="flex min-h-64 items-center justify-center"
        role="status"
      >
        <div class="text-center">
          <div
            class="border-brand-500 mx-auto h-9 w-9 animate-spin rounded-full border-2 border-t-transparent"
            aria-hidden="true"
          ></div>
          <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">
            Memuat detail absensi...
          </p>
        </div>
      </div>

      <div
        x-show="detailState.error"
        class="border-error-200 bg-error-50 dark:border-error-500/30 dark:bg-error-500/10 rounded-xl border p-5 text-center"
        role="alert"
      >
        <p
          class="text-error-700 dark:text-error-300 text-sm font-medium"
          x-text="detailState.error"
        ></p>
        <button
          type="button"
          class="border-error-300 text-error-700 focus:ring-error-500 dark:border-error-500/40 dark:text-error-300 mt-4 rounded-lg border px-4 py-2 text-sm font-medium focus:ring-2 focus:outline-none"
          @click="retryAttendanceDetail()"
        >
          Coba lagi
        </button>
      </div>

      <div
        x-show="detailState.unavailable"
        class="rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-600 dark:bg-gray-800 dark:text-gray-300"
        role="status"
      >
        Catatan absensi ini sudah tidak tersedia.
      </div>

      <div
        x-show="!detailState.loading && !detailState.error && !detailState.unavailable && detailState.detail"
        class="space-y-5"
      >
        <section
          class="rounded-xl border border-gray-200 p-4 sm:p-5 dark:border-gray-700"
        >
          <h3
            class="text-sm font-semibold tracking-wide text-gray-500 uppercase dark:text-gray-400"
          >
            Pegawai
          </h3>
          <dl class="mt-4 grid gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <dt class="text-xs text-gray-500 dark:text-gray-400">Nama</dt>
              <dd
                class="mt-1 font-medium text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.employee.fullName || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">NIP/NIM</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.employee.nipNim || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">Peran</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.employee.role || '-'"
              ></dd>
            </div>
            <div class="sm:col-span-2">
              <dt class="text-xs text-gray-500 dark:text-gray-400">Email</dt>
              <dd
                class="mt-1 text-sm break-all text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.employee.email || '-'"
              ></dd>
            </div>
          </dl>
        </section>

        <section
          class="rounded-xl border border-gray-200 p-4 sm:p-5 dark:border-gray-700"
        >
          <h3
            class="text-sm font-semibold tracking-wide text-gray-500 uppercase dark:text-gray-400"
          >
            Catatan Kehadiran
          </h3>
          <dl class="mt-4 grid gap-4 sm:grid-cols-2">
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">
                ID Absensi
              </dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.idAttendance ?? '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">Tanggal</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.attendanceDate || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">Masuk</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.timeIn || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">Pulang</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.timeOut || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">
                Durasi kerja
              </dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.workHour || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">Mode</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.modeLabel || selectedAttendanceDetail.mode || '-'"
              ></dd>
            </div>
            <div>
              <dt class="text-xs text-gray-500 dark:text-gray-400">Status</dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.statusLabel || selectedAttendanceDetail.status || '-'"
              ></dd>
            </div>
            <div x-show="selectedAttendanceDetail.bookingId !== null">
              <dt class="text-xs text-gray-500 dark:text-gray-400">
                ID Booking
              </dt>
              <dd
                class="mt-1 text-sm text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.bookingId"
              ></dd>
            </div>
            <div class="sm:col-span-2">
              <dt class="text-xs text-gray-500 dark:text-gray-400">Catatan</dt>
              <dd
                class="mt-1 text-sm whitespace-pre-wrap text-gray-900 dark:text-white"
                x-text="selectedAttendanceDetail.notes || '-'"
              ></dd>
            </div>
          </dl>
        </section>

        <section
          class="rounded-xl border border-gray-200 p-4 sm:p-5 dark:border-gray-700"
        >
          <h3
            class="text-sm font-semibold tracking-wide text-gray-500 uppercase dark:text-gray-400"
          >
            Bukti Lokasi
          </h3>
          <template
            x-if="Number.isFinite(selectedAttendanceDetail.location.latitude) && Number.isFinite(selectedAttendanceDetail.location.longitude)"
          >
            <div class="mt-4 space-y-4">
              <dl class="grid gap-4 sm:grid-cols-2">
                <div class="sm:col-span-2">
                  <dt class="text-xs text-gray-500 dark:text-gray-400">
                    Deskripsi
                  </dt>
                  <dd
                    class="mt-1 text-sm text-gray-900 dark:text-white"
                    x-text="selectedAttendanceDetail.location.description || '-'"
                  ></dd>
                </div>
                <div>
                  <dt class="text-xs text-gray-500 dark:text-gray-400">
                    Latitude
                  </dt>
                  <dd
                    class="mt-1 font-mono text-sm text-gray-900 dark:text-white"
                    x-text="selectedAttendanceDetail.location.latitude"
                  ></dd>
                </div>
                <div>
                  <dt class="text-xs text-gray-500 dark:text-gray-400">
                    Longitude
                  </dt>
                  <dd
                    class="mt-1 font-mono text-sm text-gray-900 dark:text-white"
                    x-text="selectedAttendanceDetail.location.longitude"
                  ></dd>
                </div>
                <div
                  x-show="Number.isFinite(selectedAttendanceDetail.location.radius)"
                >
                  <dt class="text-xs text-gray-500 dark:text-gray-400">
                    Radius
                  </dt>
                  <dd
                    class="mt-1 text-sm text-gray-900 dark:text-white"
                    x-text="Number.isFinite(selectedAttendanceDetail.location.radius) ? selectedAttendanceDetail.location.radius + ' m' : '-'"
                  ></dd>
                </div>
              </dl>
              <div
                class="h-56 overflow-hidden rounded-lg border border-gray-200 dark:border-gray-700"
              >
                <div
                  id="attendanceDetailMapContainer"
                  data-location-map
                  class="h-full w-full bg-gray-100 dark:bg-gray-800"
                ></div>
              </div>
            </div>
          </template>
          <template
            x-if="!Number.isFinite(selectedAttendanceDetail.location.latitude) || !Number.isFinite(selectedAttendanceDetail.location.longitude)"
          >
            <p
              class="mt-4 rounded-lg bg-gray-50 p-4 text-sm text-gray-500 dark:bg-gray-800 dark:text-gray-400"
            >
              Lokasi absensi tidak tersedia.
            </p>
          </template>
        </section>
      </div>
    </div>

    <div
      class="flex justify-end border-t border-gray-200 p-5 sm:p-6 dark:border-gray-700"
    >
      <button
        type="button"
        class="focus:ring-brand-500 rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:ring-2 focus:outline-none dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
        @click="closeAttendanceDrawer()"
      >
        Tutup
      </button>
    </div>
  </div>
</div>
